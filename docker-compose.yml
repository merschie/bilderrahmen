# Zum lokalen Testen. Auf Unraid siehe unraid-template.xml bzw. README.
services:
  bilderrahmen:
    build: .
    image: bilderrahmen:latest
    container_name: bilderrahmen
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./photos:/photos:ro
      - ./config:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      ADMIN_PASSWORD: ""       # leer = Einstellungen ohne Passwort
      RESCAN_MINUTES: "30"     # Fotoordner alle x Minuten neu einlesen
      MAX_IMAGE_SIZE: "2560"   # Fotos auf max. x Pixel verkleinern (0 = Original)
